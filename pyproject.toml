[project]
name = "skillc"
version = "0.4.0"
description = "Skills are the new code. Code doesn't ship uncompiled."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cooneycw" }]
dependencies = []

[project.scripts]
skillc = "skillc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A stalled test hangs CI without limit (#148) - a per-test default so a stall
# fails in minutes and names the test, instead of running until someone
# notices. A test that legitimately needs longer raises it with
# `@pytest.mark.timeout`.
timeout = 120
# #315: the selector the <agent-host> real-Docker runner collects with
# (`pytest -m real_docker`). Registered explicitly so a new real-Docker test
# file opts in by adding this one mark, with no runner-script change -
# unregistered would still work, but would warn on every collection.
markers = [
    "real_docker: needs a real Docker daemon, not the fake CLI fixture",
]

[tool.mypy]
# The typecheck scope, declared once. CI, AGENTS.md and ci/typecheck-control.sh
# all run bare `mypy`, so narrowing this list is what the control catches (#19).
files = ["skillc", "tests", "ci"]
# The Level 1 task keeps several candidate `src/slugify.py` files side by side on
# purpose (#5). They are one module name many times over, so a whole-tree
# `mypy .` must not discover them; the grader and gate beside them stay in reach.
# tests/fixtures/profile-cpp-codex-flow-check-ea6dbfa/ is a real, trimmed CPP
# checkout snapshot (#265/#287): its own lib/cicd is bundled TWICE (once at the
# checkout root, once mirrored inside codex/skills/flow-check/, exactly as the
# real subject's source tree does) - two files both named `lib/cicd/__init__.py`,
# which mypy's module-name inference (not skillc's own closure walker) cannot
# tell apart. Excluded as fixture data, not code this repo type-checks.
exclude = ['^evals/level1/[^/]+/(fixture|reference|alternatives|wrong)/',
           '^tests/fixtures/profile-cpp-codex-flow-check-ea6dbfa/']
