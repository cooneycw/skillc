[project]
name = "skillc"
version = "0.1.0"
description = "Skills are the new code. Code doesn't ship uncompiled."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cooneycw" }]
dependencies = []

[project.scripts]
skillc = "skillc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# The typecheck scope, declared once. CI, AGENTS.md and ci/typecheck-control.sh
# all run bare `mypy`, so narrowing this list is what the control catches (#19).
files = ["skillc", "tests"]
