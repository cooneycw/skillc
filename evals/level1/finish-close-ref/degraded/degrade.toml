# blocks ([177,209]) that explain the rule to a reader; the exit-5 and
# exit-7/8 doc-comment entries ([280,284],[289,299]) with exit 6 preserved
# between them; the ALLOW_NEGATED_CLOSE variable and its CLI case-parsing
# block ([333,333],[343,346]); guard_negated_close_keywords itself, header
# comment and single call site ([979,1061],[1409,1409]); and, in the
