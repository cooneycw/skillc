# Facts about five files in claude-power-pack at the pinned revision, never
# their text (CPP's LICENSE "## Scope" does not cover codex/skills/ - see
# DEGRADATION.md). `prepare.py`, given a real checkout, turns this into the
# degraded arm and verifies every fact below against it before writing
# anything. Line numbers are 1-indexed and refer to the file AT THE PINNED
# REVISION; `delete_ranges` are inclusive `[start, end]` pairs.

[source]
repo = "cooneycw/claude-power-pack"
revision = "85e9b03ad2af1c41020ff6d92d36fa257bdacd2b"
# Matches a STATEMENT of the negated/incidental-closing-keyword rule: the
# removed guard's own identifiers, its issue number, and the specific prose
# phrasing the three reference.md blocks and the two scripts actually use.
# Deliberately not a bare "negat.*clos" co-occurrence - that would also fire
# on the retained incidental-close guard's own, unrelated negation-awareness
# code (see each script location's `residual_lines`).
rule_patterns = [
    "guard_negated_close_keywords",
    "ALLOW_NEGATED_CLOSE",
    "--allow-negated-close",
    "#726",
    "negated (?:and|or) incidental",
    "negated or incidental closing keyword",
    "does not close #",
    "NEGATED close/fix/resolve",
    "a negated (?:close|closing)",
    "negated issue-closing keyword",
    "Negated close keywords still close issues",
    "Negated issue-closing keywords",
    # The GENERAL fact (broader than "negated"): a keyword next to #N closes
    # regardless of grammatical role. Derived from the classifier's own
    # header comment and the retained guard's own header paragraph - both
    # deleted below, so these two patterns hit the ORIGINAL and miss the
    # PREPARED text.
    "regardless of what precedes the keyword",
    "does not care that the keyword",
]

# --------------------------------------------------------------------------
# reference.md: one prose block explaining the rule (flow-finish only has
# this one - it does not invoke the merge itself). flow-merge and flow-auto
# each ALSO carry a MERGE_RC/exit-code bullet list further down, documenting
# exits 5 (negated) and 7+8 (incidental) with exit 6 (base-move, unrelated)
# preserved in between - two non-adjacent range groups.

[[locations]]
skill = "flow-finish"
path = "reference.md"
original_sha256 = "e5e78dd36892b5461aef49734003841be6fedcb82682735c1b8f0a4043cd0ef6"
delete_ranges = [[307, 352]]
result_sha256 = "079934985db252f68ddeac84353b9f8b39b359cc1648193b9b11fee5d6d0c977"

[[locations]]
skill = "flow-merge"
path = "reference.md"
original_sha256 = "03078551b0a0823665ab4e46d7619d2d3cfe4c9df0e741450e8cbe760977cb64"
delete_ranges = [[107, 127], [167, 172], [179, 189]]
result_sha256 = "7ea6ae1b14ff6a51b72cb9800be1ed8b22b3ed36e0f47c87798d8ea422c750b6"
# The exit-6 (base-move) bullet, preserved between the deleted exit-5 and
# exit-7/8 ranges - proves a wider range did not swallow it too.
must_still_contain = [
    "bf1103bb37a39d27ff1391989ab11392738f6482bdc58cb516817d7d6f07cf1e",
]

[[locations]]
