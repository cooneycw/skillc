# Generated by Claude Power Pack /cicd:pipeline
# https://woodpecker-ci.org/docs/usage/pipeline-syntax

when:
  branch: [main]
  event: [push, pull_request]

steps:
  - name: lint-first
    image: python:3.12
    commands:
      - pip install uv
      - uv sync
      - make lint

  - name: test
    image: python:3.12
    commands:
      - pip install uv
      - uv sync
      - make test

  - name: typecheck
    image: python:3.12
    commands:
      - pip install uv
      - uv sync
      - make typecheck
