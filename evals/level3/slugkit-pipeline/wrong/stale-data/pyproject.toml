[project]
name = "slugkit"
version = "0.1.0"
description = "Turn a title into a URL slug, with symbol replacements."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slugify_installed = "slugkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slugkit"]
