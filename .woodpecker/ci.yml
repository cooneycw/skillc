# Feature branches run pull_request only; push runs on main only, so one
# change does not queue two identical pipelines.
when:
  - event: push
    branch: main
  - event: pull_request

# The dedicated CI VM (agent 93). Unpinned, a pipeline can land on a
# deploy-labelled agent that has no business running it.
labels:
  host: kyleci

steps:
  # The four checks AGENTS.md names as the verify gate.
  - name: gate
    image: python:3.12-slim
    depends_on: []
    commands:
      # #412: the CI VM's own state, at the step's start and (EXIT trap, on
      # pass or fail, exit status preserved) its end. /proc/loadavg, not
      # `uptime`: python:3.12-slim has no procps, and a missing `uptime`
      # would print "not found" inside a green echo. 806's reds could not be
      # told apart from contention afterwards because nothing recorded this.
      - echo "gate-host start nproc=$(nproc) loadavg=$(cat /proc/loadavg)"; trap 'echo "gate-host end nproc=$(nproc) loadavg=$(cat /proc/loadavg)"' EXIT
      # #307: git-dependent tests (now all of #275's git fixtures, plus the
      # pre-existing needs_git-marked tests in test_degrade/test_changelog_check/
      # test_provenance/test_profile/test_materialize) previously skipped here
      # silently - AGENTS.md's "the git and real-client tests skip there and
      # run on a host" was true of this image. Same apt line changelog-check
      # already uses. #276: jq too - the fixture service evaluates --jq
      # filters with REAL jq 1.7.x on the controller, and its tests skip
      # without it (git-tests-control below refuses a jq-named skip).
      # #434: make too - the flow-auto-necessity fixture's gate-surface controls run
      # `make`, and git-tests-control refuses a make-named skip.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq make > /dev/null
      - pip install uv
      # --locked refuses a stale uv.lock; --no-sync stops each run re-locking.
      - uv sync --locked --extra dev
      - uv run --no-sync skillc selftest
      # -rA (#148): every outcome, not just failures, survives to the CI log
      # even when the run as a whole passes - the log is what actually
      # persists past this step; nothing here uploads a separate artifact.
      # (flow:auto #12's flaky test, never captured, was a LOCAL one-off, not
      # a CI run - #134's `make verify` covers that sighting; see AGENTS.md.)
      # --junit-xml (#307): read by the git-tests-control step below, from
      # the shared workspace (steps do not share each other's /tmp).
      # One full collection, then ordinary workers followed by isolated load self-tests.
      - uv run --no-sync python3 ci/run_pytest_lanes.py --workers auto --maxprocesses=8 --dist=loadgroup --durations=0 --report-dir .
      # Match local lint: nested project caches must stay outside frozen fixtures.
      - uv run --no-sync ruff check --cache-dir .ruff_cache .
      - uv run --no-sync mypy

  # Independent collection plus a committed short-report negative control (#364).
  - name: pytest-population-control
    image: python:3.12-slim
    depends_on: [gate]
    commands:
      - python3 ci/check_pytest_population.py pytest-collected.txt pytest-report.xml
      - bash ci/pytest-population-control.sh
      - bash ci/pytest-lanes-control.sh

  # #307: proves the git-dependent population above actually RAN, not just
  # that `gate` exited 0 - a file whose whole git-gated subset re-skipped
  # would not turn `gate` red on its own. Depends on `gate` for its report;
  # if `gate` fails or never writes pytest-report.xml, Woodpecker skips this
  # step rather than running it - the pipeline is already red in that case,
  # so a skipped CONTROL here must never be misread as the control passing.
  - name: git-tests-control
    image: python:3.12-slim
    depends_on: [gate]
    commands:
      - python3 ci/check_git_tests_ran.py pytest-report.xml
      - bash ci/git-tests-control.sh
    environment:
      # Parallel steps share one workspace; a shared .venv races.
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv

  # The gate above trusts selftest's green. This proves selftest can still
  # report the other verdict; see the script header.
  - name: negative-control
    image: python:3.12-slim
    depends_on: []
    commands:
      - pip install uv
      - uv sync --locked
      - uv run --no-sync bash ci/negative-control.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv

  # The gate's mypy green is only evidence while tests/ is in its scope (#19).
  # This plants a type error in a test module and requires mypy to report it.
  - name: typecheck-control
    image: python:3.12-slim
    depends_on: []
    commands:
      - pip install uv
      - uv sync --locked --extra dev
      - uv run --no-sync bash ci/typecheck-control.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv

  # Secret scan of the checked-out tree, which is what a squash merge lands.
  # Not `gitleaks git`: the clone is --depth=1, so a history scan would cover
  # one commit and still print green. The control proves the scan can find one.
  - name: secret-scan
    image: zricethezav/gitleaks:v8.30.1
    depends_on: []
    commands:
      - gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - bash ci/secret-scan-control.sh

  # Machine-identity leak scan of the checked-out tree (#63): skillc is public,
  # so a home-directory path, a uid/gid, a private IP or a denylisted hostname
  # must not be committed. Three narrow exclusions, each a single path that
  # exists to hold seeded, obviously-fake leak examples ON PURPOSE - not a
  # general allowlist: controls/leak-check/bad/ (the negative control's
  # fixture), tests/test_leak.py (this scanner's own unit-test literals), and
  # ci/leak-check-control.sh (its own seeded shell commands, case 4 below).
  - name: leak-check
    image: python:3.12-slim
    depends_on: []
    commands:
      - pip install uv
      - uv sync --locked --extra dev
      # Exported once, used for the real scan AND passed to the control
      # script below (as $SKILLC_EXCLUDE_ARGS) - one definition, so the two
      # cannot silently drift apart (the control script's own default is a
      # fallback for a standalone run, not the source of truth here).
      - export SKILLC_EXCLUDE_ARGS="--exclude controls/leak-check/bad --exclude tests/test_leak.py --exclude ci/leak-check-control.sh --exclude pytest-collected.txt --exclude tests/fixtures/leak_seeds"
      - uv run --no-sync skillc leak-check . $SKILLC_EXCLUDE_ARGS
      - uv run --no-sync bash ci/leak-check-control.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv

  # A PR touching skillc/ must add a changelog.d/<issue>.md fragment (#439), or carry
  # a Changelog-exempt: <reason> trailer on its HEAD commit (#73). Two-dot
  # diff against origin/main (never three-dot): it compares tree snapshots
  # directly and needs no merge-base, which a shallow clone may not have.
  - name: changelog-check
    image: python:3.12-slim
    depends_on: []
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
      # Unshallow first (best effort): a merge-base needs shared history, which
      # a shallow clone's default depth may not carry.
      - git fetch --unshallow origin --quiet 2>/dev/null || true
      - git fetch origin main --quiet
      - python3 ci/changelog_check.py origin/main

  # README drift (#73): the commands block against the real argparse parser,
  # the stated version against the package version, and the milestones table
  # against docs/milestones.json - no GitHub network access, by design.
  - name: readme-drift
    image: python:3.12-slim
    depends_on: []
    commands:
      - pip install uv
      - uv sync --locked --extra dev
      - uv run --no-sync python3 ci/readme_drift.py
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv

  # Built wheel in a fresh venv, then sabotage each committed control (#72).
  - name: clean-install
    image: python:3.12-slim
    depends_on: []
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
      - pip install uv
      - uv sync --locked
      - bash ci/clean-install-check.sh
      - CLEAN_INSTALL_CONTROL=neuter-installed-rule bash ci/clean-install-check.sh
      - CLEAN_INSTALL_CONTROL=delete-scratch-controls bash ci/clean-install-check.sh
      - bash ci/clean-install-comparison-control.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/skillc-venv
